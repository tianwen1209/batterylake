<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>batterylake-processing · BatteryLake skill</title>
<link rel="icon" href="../assets/logos/batterylake_logo.png">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&family=Source+Code+Pro:wght@400;500;600&family=Fraunces:wght@400;600;700&display=swap" rel="stylesheet">
<script src="../js/theme-init.js"></script>
<script src="../assets/vendor/marked.min.js"></script>
<style>
  :root {
    --bg: #ffffff; --bg2: #f3f6fc; --bg3: #e9eef7; --surface: #ffffff;
    --border: #e4e9f2; --border2: #cfd8e6; --divider: #d7deeb;
    --text1: #151d2c; --text2: #414c5e; --text3: #6b7689; --text4: #98a3b6;
    --accent: #2a5fea; --accent-light: #eaf1ff; --accent-hover: #1d4bd1;
    --green: #15a05a; --green-bg: #e8f8ef; --amber: #d9810a; --amber-bg: #fff4e3;
    --code-bg: #111827; --code-text: #dbe7f7; --inline-code-bg: #eef2f9;
    --card-shadow: 0 1px 2px rgba(22,30,48,.04), 0 2px 8px rgba(22,30,48,.05);
    --sans: 'Noto Sans', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --mono: 'Source Code Pro', ui-monospace, SFMono-Regular, Menlo, 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', monospace;
    --display: 'Fraunces', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', Georgia, serif;
    --topbar-h: 60px;
  }
  [data-theme="dark"] {
    --bg: #111d31; --bg2: #0a1424; --bg3: #17263d; --surface: #122037;
    --border: #263a59; --border2: #3a5375; --divider: #314664;
    --text1: #f4f8ff; --text2: #d7e1ef; --text3: #9fb0c7; --text4: #7588a2;
    --accent: #7db3ff; --accent-light: rgba(125,179,255,.16); --accent-hover: #9bc5ff;
    --green: #4ade80; --green-bg: rgba(74,222,128,.14); --amber: #fbbf24; --amber-bg: rgba(251,191,36,.15);
    --code-bg: #08111f; --code-text: #dbeafe; --inline-code-bg: #1b2c47;
    --card-shadow: 0 1px 0 rgba(255,255,255,.035) inset, 0 16px 38px rgba(0,0,0,.26);
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--bg2); color: var(--text1); font-family: var(--sans); font-size: 15px; line-height: 1.65; -webkit-font-smoothing: antialiased; }
  a { color: var(--accent); }

  /* ── top bar ── */
  .topbar {
    position: sticky; top: 0; z-index: 20; height: var(--topbar-h); display: flex; align-items: center; gap: 18px; padding: 0 26px;
    background: var(--surface); border-bottom: 1px solid var(--border);
  }
  .topbar-logo { display: flex; align-items: center; }
  .topbar-logo img { height: 30px; width: auto; display: block; }
  .topbar-back {
    display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 9px; font-size: 13px; font-weight: 600;
    color: var(--text2); text-decoration: none; border: 1px solid var(--border); background: var(--bg);
  }
  .topbar-back:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }
  .topbar-title { font-family: var(--mono); font-size: 14px; font-weight: 600; color: var(--text2); margin-left: auto; }
  .theme-toggle {
    width: 36px; height: 36px; border-radius: 9px; border: 1px solid var(--border); background: var(--bg); color: var(--text2); cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .theme-toggle:hover { border-color: var(--accent); color: var(--accent); }
  [data-theme="dark"] .theme-icon-moon, :root:not([data-theme="dark"]) .theme-icon-sun { display: none; }

  /* ── layout ── */
  .shell { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 28px; max-width: 1280px; margin: 0 auto; padding: 26px 26px 60px; }
  .side { position: sticky; top: calc(var(--topbar-h) + 22px); align-self: start; display: flex; flex-direction: column; gap: 18px; max-height: calc(100vh - var(--topbar-h) - 44px); overflow: auto; }
  .side-title { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--text3); margin-bottom: 8px; }
  .doc-list { display: flex; flex-direction: column; gap: 4px; }
  .doc-link {
    display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 9px 12px; border-radius: 10px;
    text-decoration: none; color: var(--text2); border: 1px solid transparent;
  }
  .doc-link:hover { background: var(--bg3); }
  .doc-link.active { background: var(--accent-light); border-color: var(--accent); color: var(--text1); }
  .doc-link strong { display: block; font-size: 13.5px; font-weight: 600; }
  .doc-link span { display: block; font-family: var(--mono); font-size: 11px; color: var(--text4); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .doc-lang { font-size: 10.5px; font-weight: 700; padding: 2px 6px; border-radius: 5px; background: var(--bg3); color: var(--text3); }
  .doc-link.active .doc-lang { background: var(--accent); color: #fff; }
  .toc { display: flex; flex-direction: column; gap: 2px; }
  .toc a { display: block; padding: 5px 10px; border-left: 2px solid var(--divider); font-size: 12.5px; color: var(--text3); text-decoration: none; line-height: 1.4; }
  .toc a.h3 { padding-left: 22px; font-size: 12px; }
  .toc a:hover, .toc a.active { color: var(--accent); border-left-color: var(--accent); }
  .side-download {
    display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 10px 14px; border-radius: 10px; font-size: 13px; font-weight: 600;
    background: var(--accent); color: #fff; text-decoration: none;
  }
  .side-download:hover { background: var(--accent-hover); }

  /* ── document ── */
  .doc { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--card-shadow); padding: 36px 44px 48px; min-width: 0; }
  .doc-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin-bottom: 8px; }
  .doc-path { font-family: var(--mono); font-size: 12.5px; color: var(--text3); }
  .doc-raw { margin-left: auto; font-size: 12.5px; }
  .doc-meta[hidden] { display: none; }
  .doc-meta { display: grid; gap: 6px; margin: 16px 0 26px; padding: 14px 18px; border-radius: 12px; background: var(--bg2); border: 1px solid var(--border); }
  .doc-meta div { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 12px; font-size: 13.5px; }
  .doc-meta dt { margin: 0; font-family: var(--mono); font-size: 12px; color: var(--text3); }
  .doc-meta dd { margin: 0; color: var(--text2); }
  .doc-state { padding: 60px 0; text-align: center; color: var(--text3); }
  .doc-state.error { color: var(--amber); }

  .md { color: var(--text2); font-size: 15px; line-height: 1.75; }
  .md > :first-child { margin-top: 0; }
  .md h1 { font-family: var(--display); font-size: 30px; font-weight: 700; letter-spacing: -.01em; line-height: 1.25; color: var(--text1); margin: 0 0 18px; }
  .md h2 { font-family: var(--display); font-size: 22px; font-weight: 700; color: var(--text1); margin: 40px 0 12px; padding-top: 18px; border-top: 1px solid var(--divider); scroll-margin-top: calc(var(--topbar-h) + 16px); }
  .md h3 { font-size: 16.5px; font-weight: 700; color: var(--text1); margin: 26px 0 8px; scroll-margin-top: calc(var(--topbar-h) + 16px); }
  .md h4 { font-size: 15px; font-weight: 700; color: var(--text1); margin: 20px 0 6px; }
  .md p { margin: 0 0 14px; }
  .md ul, .md ol { margin: 0 0 14px; padding-left: 26px; }
  .md li { margin: 4px 0; }
  .md li > p { margin-bottom: 6px; }
  .md strong { color: var(--text1); }
  .md code { font-family: var(--mono); font-size: .9em; background: var(--inline-code-bg); color: var(--text1); padding: 1px 6px; border-radius: 5px; }
  .md pre { margin: 0 0 18px; padding: 16px 18px; border-radius: 12px; background: var(--code-bg); color: var(--code-text); overflow-x: auto; font-family: var(--mono); font-size: 12.8px; line-height: 1.6; }
  .md pre code { background: transparent; color: inherit; padding: 0; font-size: inherit; }
  .md blockquote { margin: 0 0 16px; padding: 10px 16px; border-left: 3px solid var(--accent); background: var(--accent-light); border-radius: 0 10px 10px 0; color: var(--text2); }
  .md blockquote p:last-child { margin-bottom: 0; }
  .md hr { border: 0; border-top: 1px solid var(--divider); margin: 28px 0; }
  .md .table-wrap { overflow-x: auto; margin: 0 0 18px; border: 1px solid var(--border); border-radius: 12px; }
  .md table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  .md th, .md td { padding: 10px 14px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--border); }
  .md th { background: var(--bg2); color: var(--text1); font-weight: 700; white-space: nowrap; }
  .md tr:last-child td { border-bottom: 0; }
  .md td code { white-space: nowrap; }
  .md a.doc-xref { font-weight: 600; }
  .md span.dead-link { color: var(--text3); border-bottom: 1px dotted var(--border2); cursor: help; }
  .md img { max-width: 100%; }

  @media (max-width: 920px) {
    .shell { grid-template-columns: minmax(0, 1fr); padding: 18px 14px 40px; }
    .side { position: static; max-height: none; }
    .toc-block { display: none; }
    .doc { padding: 24px 20px 32px; }
    .topbar { padding: 0 14px; }
    .topbar-title { display: none; }
  }
</style>
</head>
<body>
<header class="topbar">
  <a class="topbar-logo" href="../#home" aria-label="BatteryLake home"><img id="logo" src="../assets/logos/logo-light.png" alt="BatteryLake"></a>
  <a class="topbar-back" href="../#preprocessing">
    <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
    Preprocessing
  </a>
  <span class="topbar-title">batterylake-processing</span>
  <button class="theme-toggle" type="button" id="theme-toggle" aria-label="Switch theme" title="Switch theme">
    <svg class="theme-icon-sun" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
    <svg class="theme-icon-moon" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A8.5 8.5 0 1111.21 3 6.6 6.6 0 0021 12.79z"/></svg>
  </button>
</header>

<div class="shell">
  <aside class="side">
    <div>
      <div class="side-title">Skill package</div>
      <nav class="doc-list" id="doc-list" aria-label="Documents"></nav>
    </div>
    <div class="toc-block" id="toc-block" hidden>
      <div class="side-title">On this page</div>
      <nav class="toc" id="toc" aria-label="Table of contents"></nav>
    </div>
    <a class="side-download" href="../#preprocessing">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Download the skill (.zip)
    </a>
  </aside>

  <main class="doc" id="doc">
    <div class="doc-head">
      <span class="doc-path" id="doc-path"></span>
      <a class="doc-raw" id="doc-raw" href="#" target="_blank" rel="noopener">Open raw file</a>
    </div>
    <dl class="doc-meta" id="doc-meta" hidden></dl>
    <article class="md" id="md"><div class="doc-state">Loading…</div></article>
  </main>
</div>

<script>
(function () {
  'use strict';
  var ROOT = '../assets/skills/batterylake-processing/';
  var DOCS = [
    { key: 'skill', path: 'SKILL.md', title: 'SKILL.md', sub: 'Execution routing (read first)', lang: 'ZH' },
    { key: 'schema', path: 'references/schema.md', title: 'Schema 2.0.0', sub: 'references/schema.md', lang: 'ZH' },
    { key: 'equivalence', path: 'references/equivalence.md', title: 'Equivalence contract', sub: 'references/equivalence.md', lang: 'ZH' },
    { key: 'standard', path: 'standard/README.md', title: 'Processing standard v2.0.0', sub: 'standard/README.md', lang: 'EN' },
    { key: 'standard-zh', path: 'standard/README.zh-CN.md', title: '处理规范 v2.0.0', sub: 'standard/README.zh-CN.md', lang: 'ZH' }
  ];
  /* Relative link targets that appear inside the documents, mapped to viewer docs. */
  var XREF = {
    'references/schema.md': 'schema', 'references/equivalence.md': 'equivalence', 'SKILL.md': 'skill',
    'README.md': 'standard', 'README.zh-CN.md': 'standard-zh',
    'skills/batterylake-processing/SKILL.md': 'skill',
    'skills/batterylake-processing/references/schema.md': 'schema',
    'skills/batterylake-processing/references/equivalence.md': 'equivalence',
    '../../README.md': 'standard', '../../README.zh-CN.md': 'standard-zh',
    '../../../Processed_Dataset_Standard/README.md': 'standard'
  };

  function $(id) { return document.getElementById(id); }
  function docByKey(key) { return DOCS.find(function (d) { return d.key === key; }) || DOCS[0]; }
  function currentKey() { return new URLSearchParams(location.search).get('doc') || 'skill'; }
  function viewerUrl(key) { return '?doc=' + key; }

  /* theme */
  function applyTheme(theme) {
    document.documentElement.dataset.theme = theme;
    document.documentElement.style.colorScheme = theme;
    $('logo').src = theme === 'dark' ? '../assets/logos/logo-dark.png' : '../assets/logos/logo-light.png';
  }
  $('theme-toggle').addEventListener('click', function () {
    var next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    try { localStorage.setItem('bt-theme', next); } catch (_) {}
    applyTheme(next);
  });
  applyTheme(document.documentElement.dataset.theme || 'light');

  /* sidebar */
  function renderDocList(active) {
    $('doc-list').innerHTML = DOCS.map(function (d) {
      return '<a class="doc-link' + (d.key === active ? ' active' : '') + '" href="' + viewerUrl(d.key) + '" data-key="' + d.key + '">'
        + '<span><strong>' + d.title + '</strong><span>' + d.sub + '</span></span>'
        + '<span class="doc-lang">' + d.lang + '</span></a>';
    }).join('');
  }

  /* frontmatter */
  function splitFrontmatter(text) {
    var m = text.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n?/);
    if (!m) return { meta: null, body: text };
    var meta = {};
    m[1].split(/\r?\n/).forEach(function (line) {
      var i = line.indexOf(':');
      if (i > 0) meta[line.slice(0, i).trim()] = line.slice(i + 1).trim();
    });
    return { meta: meta, body: text.slice(m[0].length) };
  }

  /* markdown */
  function slugify(text, used) {
    var base = String(text).toLowerCase().replace(/<[^>]+>/g, '').replace(/[^\w一-鿿\- ]+/g, '').trim().replace(/\s+/g, '-') || 'section';
    var slug = base, n = 2;
    while (used[slug]) slug = base + '-' + (n++);
    used[slug] = true;
    return slug;
  }
  function render(doc, text) {
    var parts = splitFrontmatter(text);
    var meta = $('doc-meta');
    if (parts.meta) {
      meta.hidden = false;
      meta.innerHTML = Object.keys(parts.meta).map(function (k) {
        return '<div><dt>' + k + '</dt><dd>' + escapeHtml(parts.meta[k]) + '</dd></div>';
      }).join('');
    } else { meta.hidden = true; meta.innerHTML = ''; }

    var used = {};
    var headings = [];
    var renderer = new marked.Renderer();
    renderer.heading = function (textHtml, level) {
      var id = slugify(textHtml, used);
      if (level === 2 || level === 3) headings.push({ id: id, level: level, text: textHtml.replace(/<[^>]+>/g, '') });
      return '<h' + level + ' id="' + id + '">' + textHtml + '</h' + level + '>\n';
    };
    renderer.table = function (header, body) {
      return '<div class="table-wrap"><table><thead>' + header + '</thead><tbody>' + body + '</tbody></table></div>\n';
    };
    renderer.link = function (href, title, textHtml) {
      var t = title ? ' title="' + escapeHtml(title) + '"' : '';
      if (/^(https?:|mailto:)/i.test(href)) return '<a href="' + href + '"' + t + ' target="_blank" rel="noopener">' + textHtml + '</a>';
      if (/^#/.test(href)) return '<a href="' + href + '"' + t + '>' + textHtml + '</a>';
      var clean = href.replace(/^\.\//, '');
      if (XREF[clean]) return '<a class="doc-xref" href="' + viewerUrl(XREF[clean]) + '"' + t + '>' + textHtml + '</a>';
      return '<span class="dead-link" title="' + escapeHtml(href) + ' — lives in the BatteryLake data repository">' + textHtml + '</span>';
    };
    marked.setOptions({ gfm: true, breaks: false, renderer: renderer });
    $('md').innerHTML = marked.parse(parts.body);

    var toc = $('toc');
    var block = $('toc-block');
    if (headings.length) {
      block.hidden = false;
      toc.innerHTML = headings.map(function (h) {
        return '<a class="' + (h.level === 3 ? 'h3' : '') + '" href="#' + h.id + '">' + escapeHtml(h.text) + '</a>';
      }).join('');
      observeHeadings(headings);
    } else { block.hidden = true; toc.innerHTML = ''; }
  }
  function escapeHtml(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }

  var observer = null;
  function observeHeadings(headings) {
    if (observer) observer.disconnect();
    if (!('IntersectionObserver' in window)) return;
    var links = {};
    Array.prototype.forEach.call($('toc').querySelectorAll('a'), function (a) { links[a.getAttribute('href').slice(1)] = a; });
    observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (!e.isIntersecting) return;
        Object.keys(links).forEach(function (k) { links[k].classList.toggle('active', k === e.target.id); });
      });
    }, { rootMargin: '-70px 0px -70% 0px', threshold: 0 });
    headings.forEach(function (h) { var el = document.getElementById(h.id); if (el) observer.observe(el); });
  }

  function load(key, push) {
    var doc = docByKey(key);
    renderDocList(doc.key);
    $('doc-path').textContent = 'batterylake-processing/' + doc.path;
    $('doc-raw').href = ROOT + doc.path;
    document.title = doc.title + ' · batterylake-processing';
    $('md').innerHTML = '<div class="doc-state">Loading…</div>';
    if (push) history.pushState({ key: doc.key }, '', viewerUrl(doc.key));
    fetch(ROOT + doc.path, { cache: 'no-store' }).then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.text();
    }).then(function (text) {
      render(doc, text);
      if (location.hash) { var target = document.getElementById(location.hash.slice(1)); if (target) target.scrollIntoView(); }
      else window.scrollTo(0, 0);
    }).catch(function (err) {
      $('md').innerHTML = '<div class="doc-state error">Could not load ' + escapeHtml(doc.path) + ' (' + escapeHtml(err.message) + ').</div>';
    });
  }

  document.addEventListener('click', function (e) {
    var a = e.target.closest('a');
    if (!a) return;
    var href = a.getAttribute('href') || '';
    if (href.indexOf('?doc=') === 0) {
      e.preventDefault();
      load(href.slice(5), true);
    }
  });
  window.addEventListener('popstate', function () { load(currentKey(), false); });
  load(currentKey(), false);
})();
</script>
</body>
</html>
