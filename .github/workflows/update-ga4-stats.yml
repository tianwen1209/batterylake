name: Update GA4 site stats

on:
  schedule:
    # Temporary test: 14, 29, 44 and 59 minutes past every hour
    - cron: "14,29,44,59 * * * *"

    # - cron: "20 9 * * *"
    #   timezone: "Asia/Singapore"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  schedule-check:
    runs-on: ubuntu-latest
    steps:
      - name: Show trigger information
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "UTC time: $(date -u)"
          echo "Singapore time: $(TZ=Asia/Singapore date)"
          
  export-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install GA4 packages
        run: pip install --quiet google-analytics-data google-auth

      - name: Export GA4 statistics
        env:
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GA4_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
        run: python scripts/export_ga4_stats.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/site-stats.json
          if git diff --staged --quiet; then
            echo "No changes to site-stats.json"
          else
            git commit -m "chore: update GA4 site statistics"
            git push
          fi
